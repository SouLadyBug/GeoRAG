# Out-of-scope questions. A grounded assistant should refuse these: the corpus (geospatial
# research abstracts, technical documentation, dataset descriptions) does not contain the answer.
# Half are clearly off-topic; half are near the domain but ask for facts the corpus cannot hold
# (prices, schedules, personal details, events after the snapshot).
