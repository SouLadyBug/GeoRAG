- {id: bigearthnet, label: BigEarthNet, type: dataset, aliases: [BigEarthNet], definition: Large multi-label Sentinel-1/2 patch benchmark.}
- {id: eurosat, label: EuroSAT, type: dataset, aliases: [EuroSAT], definition: Sentinel-2 land-use scene classification dataset.}
- {id: spacenet, label: SpaceNet, type: dataset, aliases: [SpaceNet], definition: Building and road extraction challenge datasets.}
- {id: xbd, label: xBD, type: dataset, aliases: [xBD, xView2], definition: Building damage assessment dataset from pre/post-disaster imagery.}
- {id: isprs_benchmark, label: ISPRS benchmarks, type: dataset, aliases: [ISPRS Vaihingen, ISPRS Potsdam, Vaihingen, Potsdam], definition: Aerial semantic labelling and 3D reconstruction benchmarks.}
- {id: dales, label: DALES, type: dataset, aliases: [DALES], definition: Large aerial LiDAR semantic segmentation dataset.}
- {id: semantic3d, label: Semantic3D, type: dataset, aliases: [Semantic3D, Toronto-3D, SensatUrban, Paris-Lille-3D], definition: Outdoor point-cloud segmentation benchmarks.}
- {id: openstreetmap, label: OpenStreetMap, type: dataset, aliases: [OpenStreetMap, OSM], definition: Volunteered open world map.}
- {id: worldcover, label: ESA WorldCover, type: dataset, aliases: [WorldCover, ESA WorldCover], definition: Global 10 m land-cover map from Sentinel-1 and -2.}
- {id: dynamic_world, label: Dynamic World, type: dataset, aliases: [Dynamic World], definition: Near-real-time 10 m land-cover probabilities.}
- {id: jrc_gsw, label: JRC Global Surface Water, type: dataset, aliases: [Global Surface Water, JRC Global Surface Water, GSW], definition: 30 m water occurrence and change maps from Landsat, 1984–2021.}
- {id: corine, label: CORINE Land Cover, type: dataset, aliases: [CORINE, CORINE Land Cover], definition: European land-cover inventory.}
- {id: copernicus_dem, label: Copernicus DEM, type: dataset, aliases: [Copernicus DEM, SRTM, ASTER GDEM, digital elevation model], definition: Global 30 m elevation models.}
- {id: hls, label: HLS, type: dataset, aliases: [HLS, Harmonized Landsat Sentinel-2, Harmonized Landsat and Sentinel-2], definition: NASA harmonised Landsat 8/9 and Sentinel-2 surface reflectance at 30 m.}
- {id: era5, label: ERA5, type: dataset, aliases: [ERA5], definition: ECMWF global climate reanalysis.}
- {id: gbif, label: Global building footprints, type: dataset, aliases: [Microsoft building footprints, Google Open Buildings, Open Buildings, building footprints], definition: Large-scale building footprint datasets.}
- {id: imagenet, label: ImageNet, type: dataset, aliases: [ImageNet], definition: Natural-image dataset often used for pre-training.}

# ---------------------------------------------------------------- indices and products
- {id: ndvi, label: NDVI, type: product, aliases: [NDVI, normalized difference vegetation index, normalised difference vegetation index], definition: (NIR − Red)/(NIR + Red); greenness and vegetation vigour.}
- {id: ndwi, label: NDWI, type: product, aliases: [NDWI, normalized difference water index], definition: (Green − NIR)/(Green + NIR) after McFeeters; open-water index.}
- {id: mndwi, label: MNDWI, type: product, aliases: [MNDWI, modified normalized difference water index, modified NDWI], definition: (Green − SWIR1)/(Green + SWIR1) after Xu; suppresses built-up noise and works better in turbid water.}
- {id: evi, label: EVI, type: product, aliases: [EVI, enhanced vegetation index], definition: Vegetation index corrected for soil and atmosphere.}
- {id: savi, label: SAVI, type: product, aliases: [SAVI, soil-adjusted vegetation index], definition: Vegetation index with a soil brightness factor.}
- {id: nbr, label: NBR, type: product, aliases: [NBR, dNBR, normalized burn ratio], definition: (NIR − SWIR2)/(NIR + SWIR2); burn severity.}
- {id: ndbi, label: NDBI, type: product, aliases: [NDBI, normalized difference built-up index], definition: (SWIR − NIR)/(SWIR + NIR); built-up areas.}
- {id: awei, label: AWEI, type: product, aliases: [AWEI, automated water extraction index], definition: Water index designed to suppress shadows.}
- {id: lai, label: LAI, type: product, aliases: [LAI, leaf area index], definition: One-sided leaf area per unit ground area.}
- {id: dsm, label: DSM, type: product, aliases: [DSM, digital surface model, nDSM, normalized DSM], definition: Elevation of the top surface including buildings and trees.}
- {id: dtm, label: DTM, type: product, aliases: [DTM, digital terrain model, bare-earth model], definition: Bare-ground elevation.}
- {id: chm, label: Canopy height model, type: product, aliases: [canopy height model, CHM, canopy height, tree height], definition: Vegetation height, DSM minus DTM in forests.}
- {id: lod2, label: LoD2 building model, type: product, aliases: [LoD2, LoD1, LoD3, level of detail], definition: CityGML level of detail; LoD2 adds roof shapes.}
- {id: land_cover_map, label: Land-cover map, type: product, aliases: [land cover, land-cover, land use, land-use, LULC], definition: Classification of surface cover or use.}
- {id: water_mask, label: Water mask, type: product, aliases: [water mask, water extent, surface water, water body, water bodies, open water], definition: Binary map of open water.}
- {id: flood_map, label: Flood map, type: product, aliases: [flood map, flood mapping, flood extent, inundation map, inundation], definition: Extent of inundated areas.}
- {id: point_cloud, label: Point cloud, type: product, aliases: [point cloud, point clouds], definition: Set of 3D points with attributes such as intensity and class.}
- {id: mesh, label: 3D mesh, type: product, aliases: [3D mesh, mesh model, textured mesh], definition: Surface triangulation of a scene.}
- {id: surface_reflectance, label: Surface reflectance, type: product, aliases: [L2A, Level-2A, analysis ready data, ARD], definition: Atmospherically corrected reflectance product.}
- {id: lst, label: Land surface temperature, type: product, aliases: [LST, urban heat island, surface urban heat island], definition: Radiative skin temperature of the land surface.}
- {id: aboveground_biomass, label: Above-ground biomass, type: product, aliases: [above-ground biomass, aboveground biomass, AGB, carbon stock], definition: Dry mass of vegetation above ground.}

