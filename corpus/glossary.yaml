# GeoRAG seed glossary — CC BY 4.0, Emna Saada.
# Entity types: method, sensor (sensor or platform), dataset, product (index or derived
# product), application, place, standard (file format, specification or software).
# `aliases` are matched in the corpus as whole words; all-caps aliases are case-sensitive.

# ---------------------------------------------------------------- methods
- {id: unet, label: U-Net, type: method, broader: deep_learning, aliases: [U-Net, UNet, U Net], definition: Encoder–decoder convolutional network with skip connections; the standard baseline for semantic segmentation of imagery.}
- {id: random_forest, label: Random forest, type: method, aliases: [random forest, random forests, RF classifier], definition: Ensemble of decision trees; a robust pixel- and object-based classifier for land cover.}
- {id: svm, label: Support vector machine, type: method, aliases: [support vector machine, support vector machines, SVM], definition: Margin-based classifier widely used for multispectral and hyperspectral classification.}
- {id: cnn, label: Convolutional neural network, type: method, broader: deep_learning, aliases: [convolutional neural network, convolutional neural networks, CNN, CNNs], definition: Neural network built from learned convolution filters; the backbone of most image models.}
- {id: vit, label: Vision transformer, type: method, broader: deep_learning, aliases: [vision transformer, vision transformers, ViT], definition: Transformer that processes an image as a sequence of patches.}
- {id: transformer, label: Transformer, type: method, aliases: [transformer, transformers, self-attention], definition: Attention-based architecture used for sequences, images and point clouds.}
- {id: swin, label: Swin Transformer, type: method, aliases: [Swin Transformer, Swin], definition: Hierarchical vision transformer with shifted windows.}
- {id: deeplab, label: DeepLab, type: method, aliases: [DeepLab, DeepLabv3, DeepLabv3+], definition: Segmentation network family using atrous convolution and spatial pyramid pooling.}
- {id: mask_rcnn, label: Mask R-CNN, type: method, aliases: [Mask R-CNN, Mask RCNN], definition: Two-stage instance segmentation network.}
- {id: yolo, label: YOLO, type: method, aliases: [YOLO, YOLOv5, YOLOv8], definition: Single-stage real-time object detector.}
- {id: gan, label: Generative adversarial network, type: method, aliases: [generative adversarial network, generative adversarial networks, GAN, GANs], definition: Generator–discriminator pair trained adversarially; used for super-resolution and image translation.}
- {id: diffusion_model, label: Diffusion model, type: method, aliases: [diffusion model, diffusion models, denoising diffusion], definition: Generative model that learns to reverse a noising process.}
- {id: self_supervised, label: Self-supervised learning, type: method, aliases: [self-supervised learning, self-supervised, contrastive learning], definition: Pre-training from unlabeled data through pretext tasks.}
- {id: mae, label: Masked autoencoder, type: method, aliases: [masked autoencoder, masked autoencoders, MAE], definition: Self-supervised pre-training that reconstructs masked image patches.}
- {id: foundation_model, label: Foundation model, type: method, aliases: [foundation model, foundation models, geospatial foundation model, geospatial foundation models], definition: Large model pre-trained on broad data and adapted to many downstream tasks.}
- {id: prithvi, label: Prithvi, type: method, broader: foundation_model, aliases: [Prithvi, Prithvi-EO, Prithvi-100M], definition: NASA–IBM geospatial foundation model pre-trained on Harmonized Landsat Sentinel-2 data.}
- {id: satmae, label: SatMAE, type: method, broader: foundation_model, aliases: [SatMAE], definition: Masked autoencoder pre-training adapted to temporal and multispectral satellite imagery.}
- {id: clip, label: CLIP, type: method, aliases: [CLIP, RemoteCLIP, vision-language model, vision-language models], definition: Contrastive image–text model; remote-sensing variants align imagery with captions.}
- {id: llm, label: Large language model, type: method, aliases: [large language model, large language models, LLM, LLMs, GPT-4, ChatGPT], definition: Transformer language model trained on large text corpora; used for GIS agents and code generation.}
- {id: rag, label: Retrieval-augmented generation, type: method, aliases: [retrieval-augmented generation, retrieval augmented generation, RAG], definition: Generation grounded in passages retrieved from an external corpus.}
- {id: knowledge_graph, label: Knowledge graph, type: method, aliases: [knowledge graph, knowledge graphs], definition: Graph of entities and typed relations.}
- {id: graph_neural_network, label: Graph neural network, type: method, aliases: [graph neural network, graph neural networks, GNN, GNNs, graph convolutional network], definition: Neural network operating on graph-structured data.}
- {id: lstm, label: LSTM, type: method, aliases: [LSTM, long short-term memory, recurrent neural network, RNN], definition: Recurrent network for sequences such as satellite image time series.}
- {id: pointnet, label: PointNet, type: method, broader: deep_learning, aliases: [PointNet, PointNet++], definition: Network that consumes raw point sets with permutation-invariant pooling.}
- {id: kpconv, label: KPConv, type: method, broader: deep_learning, aliases: [KPConv, kernel point convolution], definition: Point convolution with deformable kernel points for point-cloud segmentation.}
- {id: point_transformer, label: Point Transformer, type: method, aliases: [Point Transformer, point cloud transformer], definition: Self-attention network for 3D point clouds.}
- {id: ransac, label: RANSAC, type: method, aliases: [RANSAC, random sample consensus], definition: Robust model fitting; standard for detecting roof planes in LiDAR.}
- {id: region_growing, label: Region growing, type: method, aliases: [region growing, region-growing], definition: Segmentation that grows regions from seeds under a similarity criterion.}
- {id: hough, label: Hough transform, type: method, aliases: [Hough transform, 3D Hough], definition: Voting-based detection of lines and planes.}
- {id: icp, label: ICP, type: method, aliases: [ICP, iterative closest point], definition: Registration of two point clouds by iterative nearest-neighbour alignment.}
- {id: slam, label: SLAM, type: method, aliases: [SLAM, simultaneous localization and mapping], definition: Building a map while localising the sensor within it.}
- {id: ground_filtering, label: Ground filtering, type: method, aliases: [ground filtering, ground filter, cloth simulation filter, progressive morphological filter, ground points], definition: Separating terrain points from objects to derive a DTM.}
- {id: photogrammetry, label: Photogrammetry, type: method, aliases: [photogrammetry, structure from motion, SfM, dense image matching, multi-view stereo], definition: 3D reconstruction from overlapping images.}
- {id: nerf, label: Neural radiance field, type: method, aliases: [neural radiance field, neural radiance fields, NeRF, Gaussian splatting, 3D Gaussian splatting], definition: Neural scene representation for novel-view synthesis and 3D reconstruction.}
- {id: building_reconstruction, label: Building reconstruction, type: method, aliases: [building reconstruction, roof reconstruction, 3D building reconstruction, building modelling, building modeling], definition: Deriving 3D building models (e.g. LoD2) from LiDAR or imagery.}
- {id: change_detection, label: Change detection, type: method, aliases: [change detection], definition: Identifying differences between acquisitions of the same area at different times.}
- {id: semantic_segmentation, label: Semantic segmentation, type: method, aliases: [semantic segmentation], definition: Assigning a class label to every pixel or point.}
- {id: object_detection, label: Object detection, type: method, aliases: [object detection], definition: Locating and classifying objects with bounding boxes.}
- {id: super_resolution, label: Super-resolution, type: method, aliases: [super-resolution, super resolution, pansharpening], definition: Increasing the spatial resolution of imagery.}
- {id: data_fusion, label: Data fusion, type: method, aliases: [data fusion, multimodal fusion, sensor fusion], definition: Combining data from several sensors or modalities.}
- {id: time_series_analysis, label: Time-series analysis, type: method, aliases: [time series analysis, time-series analysis, satellite image time series, BFAST, LandTrendr], definition: Analysing dense temporal stacks of observations.}
- {id: otsu, label: Otsu thresholding, type: method, aliases: [Otsu, Otsu thresholding, Otsu's method], definition: Automatic histogram threshold that maximises between-class variance; common for water masks.}
- {id: object_based, label: Object-based image analysis, type: method, aliases: [object-based image analysis, OBIA, GEOBIA], definition: Classification of segmented image objects rather than pixels.}
- {id: kriging, label: Kriging, type: method, aliases: [kriging, geostatistics, geostatistical], definition: Geostatistical interpolation based on a variogram model.}
- {id: idw, label: Inverse distance weighting, type: method, aliases: [inverse distance weighting, IDW], definition: Interpolation weighting samples by inverse distance.}
- {id: spatial_autocorrelation, label: Spatial autocorrelation, type: method, aliases: [spatial autocorrelation, Moran's I, Getis-Ord, hot spot analysis], definition: Measures of whether nearby values are similar.}
- {id: gwr, label: Geographically weighted regression, type: method, aliases: [geographically weighted regression, GWR], definition: Regression with spatially varying coefficients.}
- {id: network_analysis, label: Network analysis, type: method, aliases: [network analysis, shortest path, routing, isochrone, isochrones], definition: Analysis on transport or utility networks.}
- {id: map_matching, label: Map matching, type: method, aliases: [map matching, map-matching], definition: Snapping GPS trajectories to a road network.}
- {id: geocoding, label: Geocoding, type: method, aliases: [geocoding, geoparsing, toponym resolution], definition: Turning place names or addresses into coordinates.}
- {id: solar_modelling, label: Solar radiation modelling, type: method, aliases: [solar radiation modelling, solar irradiance, irradiation, shadow analysis, horizon], definition: Estimating incoming solar energy including terrain and building shading.}
- {id: hydrodynamic_modelling, label: Hydrodynamic modelling, type: method, aliases: [hydrodynamic model, hydrodynamic modelling, flood simulation, hydraulic model], definition: Simulating water flow and inundation.}
- {id: simulation, label: Simulation, type: method, aliases: [simulation, simulations, agent-based model, agent-based modelling], definition: Running models of physical or social processes inside a twin.}
- {id: interferometry, label: InSAR, type: method, aliases: [InSAR, interferometry, interferometric SAR, PS-InSAR, persistent scatterer], definition: Measuring surface deformation from SAR phase differences.}
- {id: spectral_unmixing, label: Spectral unmixing, type: method, aliases: [spectral unmixing, endmember, endmembers], definition: Decomposing mixed pixels into constituent material fractions.}
- {id: atmospheric_correction, label: Atmospheric correction, type: method, aliases: [atmospheric correction, Sen2Cor, surface reflectance, bottom-of-atmosphere], definition: Removing atmospheric effects to obtain surface reflectance.}
- {id: cloud_masking, label: Cloud masking, type: method, aliases: [cloud masking, cloud mask, cloud detection, Fmask, s2cloudless, scene classification layer], definition: Detecting clouds and shadows so they can be excluded.}
- {id: domain_adaptation, label: Domain adaptation, type: method, aliases: [domain adaptation, transfer learning, fine-tuning], definition: Adapting a model to a new region, sensor or season.}
- {id: few_shot, label: Few-shot learning, type: method, aliases: [few-shot learning, few-shot, zero-shot], definition: Learning new classes from very few labelled examples.}
- {id: active_learning, label: Active learning, type: method, aliases: [active learning], definition: Selecting the most informative samples for labelling.}
- {id: uncertainty, label: Uncertainty quantification, type: method, aliases: [uncertainty quantification, Monte Carlo, uncertainty estimation], definition: Estimating confidence intervals or error distributions of outputs.}

- {id: deep_learning, label: Deep learning, type: method, aliases: [deep learning, deep neural network, deep neural networks], definition: Learning with multi-layer neural networks; the dominant approach in geospatial image and point-cloud analysis.}
- {id: machine_learning, label: Machine learning, type: method, aliases: [machine learning, supervised learning, gradient boosting, XGBoost], definition: Statistical learning from data, from tree ensembles to neural networks.}

# ---------------------------------------------------------------- sensors and platforms
- {id: lidar, label: LiDAR, type: sensor, aliases: [LiDAR, LIDAR, lidar, laser scanning, laser scanner], definition: Light detection and ranging; active laser sensing that measures 3D structure as point clouds.}
- {id: sentinel1, label: Sentinel-1, type: sensor, broader: remote_sensing_app, aliases: [Sentinel-1, Sentinel 1], definition: ESA C-band SAR constellation, 6–12-day revisit, works through cloud.}
- {id: sentinel2, label: Sentinel-2, type: sensor, broader: remote_sensing_app, aliases: [Sentinel-2, Sentinel 2, MSI], definition: ESA multispectral constellation; 13 bands at 10–60 m, 5-day revisit.}
- {id: sentinel3, label: Sentinel-3, type: sensor, aliases: [Sentinel-3, OLCI, SLSTR], definition: ESA ocean and land colour and temperature mission.}
- {id: landsat, label: Landsat, type: sensor, broader: remote_sensing_app, aliases: [Landsat, Landsat 8, Landsat 9, Landsat-8, OLI, ETM+], definition: USGS/NASA 30 m multispectral archive since 1972.}
- {id: modis, label: MODIS, type: sensor, aliases: [MODIS], definition: Moderate-resolution (250 m–1 km) daily imager on Terra and Aqua.}
- {id: viirs, label: VIIRS, type: sensor, aliases: [VIIRS, night-time lights, nighttime lights], definition: Suomi-NPP / NOAA-20 imager, including night-time lights.}
- {id: planetscope, label: PlanetScope, type: sensor, aliases: [PlanetScope, SkySat], definition: Commercial 3 m daily constellation of small satellites.}
- {id: worldview, label: WorldView, type: sensor, aliases: [WorldView, WorldView-2, WorldView-3, QuickBird, Pleiades, Pléiades, very high resolution], definition: Commercial very-high-resolution (sub-metre) optical satellites.}
- {id: gedi, label: GEDI, type: sensor, broader: lidar, aliases: [GEDI], definition: Spaceborne full-waveform LiDAR on the ISS measuring canopy height.}
- {id: icesat2, label: ICESat-2, type: sensor, broader: lidar, aliases: [ICESat-2, ATLAS], definition: Photon-counting spaceborne laser altimeter.}
- {id: airborne_lidar, label: Airborne LiDAR, type: sensor, broader: lidar, aliases: [airborne LiDAR, airborne laser scanning, ALS, aerial LiDAR], definition: Laser scanning from aircraft; dense 3D point clouds of terrain and buildings.}
- {id: terrestrial_lidar, label: Terrestrial laser scanning, type: sensor, broader: lidar, aliases: [terrestrial laser scanning, terrestrial LiDAR, TLS], definition: Ground-based static laser scanning.}
- {id: mobile_lidar, label: Mobile laser scanning, type: sensor, broader: lidar, aliases: [mobile laser scanning, mobile mapping, MLS], definition: Laser scanning from vehicles or backpacks.}
- {id: uav, label: UAV, type: sensor, aliases: [UAV, UAVs, drone, drones, unmanned aerial vehicle, UAS], definition: Drone platform carrying cameras or LiDAR.}
- {id: hyperspectral_sensor, label: Hyperspectral imager, type: sensor, aliases: [hyperspectral, PRISMA, EnMAP, AVIRIS, hyperspectral imaging], definition: Imager with hundreds of narrow contiguous bands.}
- {id: sar, label: SAR, type: sensor, aliases: [SAR, synthetic aperture radar, TerraSAR-X, ALOS PALSAR], definition: Active microwave imaging radar.}
- {id: thermal, label: Thermal infrared, type: sensor, aliases: [thermal infrared, TIRS, ECOSTRESS, land surface temperature], definition: Sensors measuring emitted heat.}
- {id: gnss, label: GNSS, type: sensor, aliases: [GNSS, GPS], definition: Satellite positioning used for geolocation and trajectories.}
- {id: street_view, label: Street-level imagery, type: sensor, aliases: [street view, street-level imagery, Google Street View, Mapillary], definition: Ground-level panoramic imagery.}
- {id: iot, label: IoT sensors, type: sensor, aliases: [IoT, Internet of Things, sensor network, sensor networks], definition: Networked in-situ sensors that feed live data into twins.}

# ---------------------------------------------------------------- datasets
- {id: ahn, label: AHN, type: dataset, aliases: [AHN, AHN3, AHN4, AHN5, Actueel Hoogtebestand Nederland], definition: Dutch national airborne LiDAR elevation dataset.}
- {id: 3dbag, label: 3DBAG, type: dataset, aliases: [3DBAG, 3D BAG], definition: Open LoD1.2–2.2 building models of the Netherlands reconstructed from AHN.}
